<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tape chewed · Side B Labs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    :root { color-scheme: light dark; --paper: #efe6d3; --ink: #1a1714; --dim: #51483e; }
    @media (prefers-color-scheme: dark) { :root { --paper: #14120f; --ink: #efe6d3; --dim: #b3a996; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    main { display: grid; align-content: center; gap: 18px; width: min(720px, 100%); margin: 0 auto; padding: 48px 24px; }
    .n { font: 600 1rem/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; color: var(--dim); }
    h1 { margin: 0; font: 900 clamp(3rem, 12vw, 6.5rem)/.9 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; letter-spacing: -.04em; text-transform: uppercase; }
    p { margin: 0; color: var(--dim); max-width: 30em; }
    a { display: inline-block; justify-self: start; margin-top: 10px; padding: 11px 18px; background: var(--ink); color: var(--paper); border-radius: 6px; text-decoration: none; font-weight: 700; box-shadow: 4px 4px 0 #e8452c; }
    .stripes i { display: block; height: 9px; }
  </style>
</head>
<body>
  <main>
    <span class="n">ERROR 404</span>
    <h1>Tape chewed.</h1>
    <p>There's nothing at this address. The page may have moved, or the link may have been mistyped.</p>
    <a href="/">Back to the tracklist</a>
  </main>
  <div class="stripes" aria-hidden="true"><i style="background:#e8452c"></i><i style="background:#f08a1c"></i><i style="background:#f2c230"></i><i style="background:#2a9d8f"></i><i style="background:#2b4a8c"></i></div>
</body>
</html>
